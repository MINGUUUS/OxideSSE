[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxidesse"
version = "0.1.18"
description = "Python toolkit for oxide solid-state electrolyte optimization, stability screening, diffusion analysis, and Arrhenius fitting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Mingyu Jeon"}
]
license = {text = "MIT"}
keywords = ["solid-state electrolyte", "LLZO", "ASE", "SevenNet", "pymatgen", "diffusion", "materials"]
dependencies = [
  "ase>=3.28,<4",
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "matplotlib>=3.10,<4",
  "pymatgen>=2026.5.4",
  "scipy>=1.17,<2",
  "mp-api>=0.46,<0.47",
  "spglib>=2.7,<3",
  "tqdm>=4.67,<5",
]

[project.scripts]
oxidesse = "oxidesse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
